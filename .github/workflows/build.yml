name: Build

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION_NAME: ""
  RELEASE_TAG: ""
  MODULE_ZIP: ""

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make scripts executable and determine version
        run: |
          chmod +x gradlew scripts/build.sh
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | cut -d '"' -f 2)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "RELEASE_TAG=v$VERSION_NAME" >> $GITHUB_ENV
          echo "RELEASE_NAME=OTBridge v$VERSION_NAME" >> $GITHUB_ENV
          echo "MODULE_ZIP=build/otbridge-magisk-kernelsu-v$VERSION_NAME.zip" >> $GITHUB_ENV

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Package Magisk/KernelSU module
        run: ./scripts/build.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: otbridge-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: otbridge-magisk-kernelsu
          path: ${{ env.MODULE_ZIP }}
          if-no-files-found: error

      - name: Publish versioned release assets
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          prerelease: false
          make_latest: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            ${{ env.MODULE_ZIP }}
